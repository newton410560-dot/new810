name: Build El Sewedy QC (Windows EXE & Android APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows-exe:
    name: Build Windows Installer (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build Windows NSIS Installer (.exe)
        run: npm run build-win

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: El_Sewedy_QC_Windows_EXE
          path: dist/*.exe

  build-android-apk:
    name: Build Android App (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Generate Android Capacitor Project
        run: |
          npx cap add android
          npx cap sync android

      - name: Compile Android APK (Debug Installable)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../El_Sewedy_QC_Android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: El_Sewedy_QC_Android_APK
          path: El_Sewedy_QC_Android.apk
